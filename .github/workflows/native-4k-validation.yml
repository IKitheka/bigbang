name: Native UHD validation and bounded pilot benchmarks

on:
  push:
    branches: [release/native-4k-university-final]
    paths: [.github/workflows/native-4k-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-uhd-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-4k-preview:
    name: Native UHD ${{ matrix.scene }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {scene: ignition, first: 181, last: 183}
          - {scene: expansion, first: 901, last: 903}
          - {scene: molecular-cloud, first: 7501, last: 7503}
          - {scene: earth-finale, first: 8761, last: 8763}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Ubuntu native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake git libglfw3-dev libglm-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth ffmpeg
      - name: Clean configure, compile and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/uhd-evidence
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee output/uhd-evidence/configure.log
          cmake --build build --parallel 2 2>&1 | tee output/uhd-evidence/build.log
          ctest --test-dir build --output-on-failure 2>&1 | tee output/uhd-evidence/ctest.log
          python3 -m unittest discover -s tests -p test_film_render.py -v 2>&1 | tee output/uhd-evidence/python-tests.log
          git diff --exit-code 127b96ca1ca74c2eebf7fb5ef0ca03e5f9f5f9dc -- src shaders
          git rev-parse HEAD > output/uhd-evidence/source-commit.txt
          xvfb-run -a build/bigbang --renderer-info > output/uhd-evidence/opengl.txt
      - name: Render three native UHD pilot frames with verified checkpoints
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 8m xvfb-run -a -s '-screen 0 3840x2160x24' python3 scripts/render_film.py --binary build/bigbang --output-dir output/uhd-preview --first-frame ${{ matrix.first }} --end-frame ${{ matrix.last }} --width 3840 --height 2160 --fps 30 --chunk-frames 1 --chunk-timeout 150 --preset fast --crf 16
          ffprobe -v error -count_frames -show_entries stream=width,height,nb_read_frames,avg_frame_rate -of json output/uhd-preview/film.mp4 > output/uhd-evidence/ffprobe.json
          ffmpeg -nostdin -v error -i output/uhd-preview/film.mp4 -frames:v 1 output/uhd-evidence/first-frame.png
          python3 -c 'import json; from pathlib import Path; p=Path("output/uhd-preview"); m=json.loads((p/"manifest.json").read_text()); s=json.loads((p/"checkpoint.json").read_text()); print("Native UHD three-frame timing pilot; not a motion-quality preview or completed film."); print(json.dumps({"source":m["source"]["git_head"],"renderer":m["renderer"],"validated":s["final"],"render_encode_seconds":s["completed_chunks_render_encode_wall_seconds"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve previews, checksums, source evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-uhd-${{ matrix.scene }}-${{ github.run_id }}
          path: |
            output/uhd-evidence/
            output/uhd-preview/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
